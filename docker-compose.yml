services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        image: nexosoft-app:latest
        container_name: nexosoft-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_HOST: db
            DB_PORT: '3306'
        depends_on:
            - db
        volumes:
            - storage-public:/var/www/html/storage/app/public
        command: >
            sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chown -R www-data:www-data storage bootstrap/cache && chmod -R ug+rwx storage bootstrap/cache && php-fpm"

    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: nginx
        image: nexosoft-nginx:latest
        container_name: nexosoft-nginx
        restart: unless-stopped
        depends_on:
            - app
        volumes:
            - storage-public:/var/www/html/storage/app/public

    caddy:
        image: caddy:2.10-alpine
        container_name: nexosoft-caddy
        restart: unless-stopped
        depends_on:
            - nginx
        environment:
            APP_DOMAIN: ${APP_DOMAIN:-95.111.225.31.sslip.io}
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config

    db:
        image: mysql:8.0
        container_name: nexosoft-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    mysql-data:
    storage-public:
    caddy-data:
    caddy-config:
